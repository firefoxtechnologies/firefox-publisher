<g stroke="#12294a" opacity=".5" stroke-width="1.2"><path d="M70 560 H530"/></g>
<g font-family="Georgia, 'Times New Roman', serif" fill="#12294a" text-anchor="middle" font-style="italic">
<text x="300" y="650" font-size="76" letter-spacing="-1">salt &amp; ember</text>
<text x="300" y="700" font-size="20" letter-spacing="8" font-style="normal" opacity=".7">poems</text>
<text x="300" y="818" font-size="22" font-style="normal" letter-spacing="12" font-family="Arial, sans-serif" font-weight="600">M. VEGA</text></g>
<rect width="600" height="900" filter="url(#gr)" opacity="0.4"/>
<rect width="600" height="900" fill="url(#vg)"/>
<rect x="0" y="0" width="22" height="900" fill="#000" opacity=".16"/><rect x="22" y="0" width="3" height="900" fill="#fff" opacity=".22"/>
